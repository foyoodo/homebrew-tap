name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: brew style and audit
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Style and audit the cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
          HOMEBREW_NO_ANALYTICS: "1"
          # Shared runner IPs exhaust the unauthenticated GitHub API limit
          # while audit checks the Cove release. The workflow token is enough.
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          brew tap foyoodo/tap "$GITHUB_WORKSPACE"
          # Homebrew 6+ will not load an untrusted third-party tap.
          brew trust --cask foyoodo/tap/cove
          brew style "$(brew --repository foyoodo/tap)/Casks/cove.rb"

          set +e
          audit_output="$(brew audit --cask --strict --online foyoodo/tap/cove 2>&1)"
          audit_status=$?
          set -e
          printf '%s\n' "${audit_output}"
          if [[ "${audit_status}" -eq 0 ]]; then
            exit 0
          fi

          # github_latest calls /releases/latest. That endpoint is 404 until Cove
          # publishes a stable release, and brew audit turns the 404 into an
          # exception that hides every later check. Tolerate only that failure,
          # then run the rest of the strict online audit.
          problems="$(printf '%s\n' "${audit_output}" | grep -E '^[[:space:]]+\*' || true)"
          other="$(printf '%s\n' "${problems}" | grep -v 'HTTPNotFoundError' || true)"
          if [[ -z "${problems}" || -n "${other}" ]]; then
            echo "brew audit failed."
            exit 1
          fi
          echo "No stable Cove release yet. Repeating audit without the livecheck version check."
          brew audit --cask --strict --online --except=livecheck_version foyoodo/tap/cove

  install:
    name: Install smoke test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Require an Apple Silicon runner
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "uname -m=${arch}"
          test "${arch}" = "arm64"

      - name: Install the cask and check quarantine
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          brew tap foyoodo/tap "$GITHUB_WORKSPACE"
          # Fully qualified install also trusts the cask; trust first so a
          # short-name lookup cannot fail if brew loads the tap early.
          brew trust --cask foyoodo/tap/cove
          brew install --cask --appdir=/Applications foyoodo/tap/cove
          app="/Applications/Cove.app"
          test -d "${app}"
          test -x "${app}/Contents/MacOS/Cove"
          echo "Installed ${app}"
          file "${app}/Contents/MacOS/Cove"
          attrs="$(xattr -r "${app}" || true)"
          printf '%s\n' "${attrs}"
          if printf '%s\n' "${attrs}" | grep -q 'com.apple.quarantine'; then
            echo "com.apple.quarantine is still set on ${app}"
            exit 1
          fi
          echo "No quarantine attribute on ${app}"

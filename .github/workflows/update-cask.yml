name: Update casks

on:
  schedule:
    # Hourly. The job commits only when a selected release changed.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    name: Update casks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ github.token }}

      - name: Select upstream releases and update the casks
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/update-cask.py

      - name: Commit and push when a cask changed
        env:
          COMMIT_MESSAGE: ${{ steps.update.outputs.commit_message }}
        run: |
          set -euo pipefail
          git add Casks/*.rb
          if git diff --cached --quiet; then
            echo "Casks already match the selected releases. No commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${COMMIT_MESSAGE:-Update casks}"
          git push origin HEAD:main
